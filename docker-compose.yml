services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: promo_data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: promo-backend:latest
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: promo_data
      JWT_SECRET: ${JWT_SECRET}
      OPEN_API_TOKEN: ${OPEN_API_TOKEN:-default}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-pro
    image: promo-frontend:latest
    restart: unless-stopped
    ports:
      - "5166:5166"
    depends_on:
      - backend

volumes:
  pgdata:
